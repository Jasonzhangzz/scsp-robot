# Explicit command-line flags override these settings.
mode: full
lambda_mode: offline
regrasp: true
demo_overlay: true
demo_alpha: 0.3
demo_playback: reference
mpc_solver: acados
horizon: 4
command_dt: 0.03
sim_dt: 0.01
fps: 30.0
reference_window: 0.5
lookahead: 0.06
search_radii: [0.005, 0.01]
fps_samples: 8
candidate_capacity: 8
lambda_device: cpu
lambda_iterations: 20
force_limit: 10.0
ik_iterations: 60
contact_ik_iterations: 50
contact_ik_tolerance: 0.002
contact_penetration_limit: 0.008
contact_target_depth: 0.004
hand_patch_radius: 0.03
hand_rate_scale: 1.25
ik_tolerance: 0.012
# Online trigrasp cost structure; shape stays a weak objective during contact.
mpc_costs:
  contact: 5000.0
  original_contact: 150.0
  object_position: 120.0
  object_lateral: 300.0
  object_rotation: 50.0
  horizontal_recovery: 2000000.0
  horizontal_tolerance: 0.005
  transport: 1000.0
  normal_support: 1.0
  preload: 2.0
  load_balance: 10.0
  terminal: 4.0
  posture_contact_scale: 0.05
seed: 0
